<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Soma Números</title>
</head>
<body>
    <header>
        <div class="cabecalho">
         <h1>Soma Números</h1>
         <p>Digite os números a serem somados:</p>
         </div>
    </header>
        <div class="conteudo">
            <dl>
            <li><input type="number" id="num1" placeholder=" Digite o primeiro número"></li>
            <li><p class="operador"><strong>+</strong></p></li>
            <li><input type="number" id="num2" placeholder=" Digite o segundo número"></li>
            <br>
            <li><button onclick="somaNumeros()">Somar</button></li>   
            <br>      
            <input type="text" id="txtresultado" placeholder="O resultado aparecerá aqui" readonly>
            </dl>
        </div>   
<script src="script.js"></script>
</body>
</html>
